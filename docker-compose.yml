version: '3.8'

services:
  henry-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: henry-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=False
      - API_HOST=0.0.0.0
      - API_PORT=8000
    env_file:
      - .env.server
    volumes:
      # Mount Whisper model cache to persist downloaded models
      - whisper-models:/root/.cache/whisper
      # Optional: mount logs directory
      - ./logs:/app/logs
    networks:
      - henry-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  whisper-models:
    driver: local

networks:
  henry-network:
    driver: bridge
